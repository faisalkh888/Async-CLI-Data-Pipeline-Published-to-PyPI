[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "datapipe-demo-source"
version = "0.1.0"
description = "A small separately installed source plugin for datapipe integration checks"
requires-python = ">=3.12"

[project.entry-points."datapipe.sources"]
demo = "datapipe_demo_source:create_source"

[tool.hatch.build.targets.wheel]
only-include = ["datapipe_demo_source.py"]
